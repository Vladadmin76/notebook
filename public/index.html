<symbol id="bin-body" viewBox="0 0 64 64">

<symbol id="bin-full" viewBox="0 0 64 64"><use href="#bin-body"/><use href="#bin-slots-full"/><use href="#bin-rim"/><use href="#bin-papers"/><use href="#bin-lip"/></symbol>
