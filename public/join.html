<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Блокнот — приглашение</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="card">
  <h1>Блокнот</h1>
  <p id="msg">Проверяю приглашение…</p>
  <div id="ok" hidden>
    <p>Здравствуйте, <b id="who"></b>!</p>
    <p>Проверьте, что дата и время ниже верные. По ним бот будет присылать вам напоминания.</p>
    <p class="clock" id="clock"></p>
    <p class="tz" id="tz"></p>
    <button id="go">Всё верно, подключить бота</button>
  </div>
</main>
<script>
(async () => {
  const code = location.pathname.split('/').pop();
  const $ = (id) => document.getElementById(id);
  const texts = {
    used: 'Это приглашение уже использовано.',
    revoked: 'Это приглашение отозвано. Попросите новое.',
    missing: 'Ссылка недействительна. Попросите новое приглашение.',
  };
  let info;
  try { info = await (await fetch('/api/join/' + code)).json(); } catch { $('msg').textContent = 'Нет связи. Обновите страницу.'; return; }
  if (info.state !== 'open') { $('msg').textContent = texts[info.state] || texts.missing; return; }

  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const tick = () => { $('clock').textContent = new Date().toLocaleString('ru-RU', { dateStyle: 'full', timeStyle: 'medium' }); };
  tick(); setInterval(tick, 1000);
  $('tz').textContent = 'Часовой пояс: ' + tz;
  $('who').textContent = info.label;
  $('msg').hidden = true; $('ok').hidden = false;

  $('go').onclick = async () => {
    $('go').disabled = true;
    const r = await fetch('/api/join/' + code + '/claim', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ tz }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { $('go').disabled = false; alert('Не получилось: ' + (d.error || r.status)); return; }
    location.href = d.botUrl;
  };
})();
</script>
</body>
</html>
