name = "notes-bot"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Домен notes.fixtorllc.com должен быть в зоне fixtorllc.com этого же аккаунта Cloudflare
routes = [
  { pattern = "notes.fixtorllc.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
# Сначала всегда отрабатывает Worker, он сам отдаёт статику, когда нужно
run_worker_first = true

[vars]
# Username бота без @, например FixTorBlocknot_bot (задайте после создания в @BotFather)
BOT_USERNAME = "FixTorBlocknot_bot"

[[d1_databases]]
binding = "DB"
database_name = "notes_db"
# Подставьте id после `wrangler d1 create notes_db`
database_id = "269770d3-9162-45a2-9274-798ce37ce73e"
migrations_dir = "migrations"
